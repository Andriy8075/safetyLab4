<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    </head>

    <body>
        <main id="main-holder">
            <a href="/logout" id="logout">Logout</a>

            <h1 id="login-header">Вхід</h1>

            <div id="login-error-msg-holder">
                <p id="login-error-msg">Невірний email або пароль</p>
            </div>

            <form id="login-form" action="/api/login" method="post">
                <input type="text" name="login" id="username-field" class="login-form-field" placeholder="Email">
                <input type="password" name="password" id="password-field" class="login-form-field" placeholder="Пароль">
                <label class="show-password-label">
                    <input type="checkbox" id="show-login-password">
                    Показати пароль
                </label>
                <input type="submit" value="Увійти" id="login-form-submit">
            </form>

            <h2 id="register-header">Реєстрація</h2>

            <form id="register-form" action="/api/register" method="post">
                <input type="text" name="email" id="register-email-field" class="login-form-field" placeholder="Email">
                <input type="password" name="password" id="register-password-field" class="login-form-field" placeholder="Пароль">
                <label class="show-password-label">
                    <input type="checkbox" id="show-register-password">
                    Показати пароль
                </label>
                <input type="submit" value="Створити користувача" id="register-form-submit">
            </form>
        </main>
    </body>

    <style>
        html {
            height: 100%;
        }

        body {
            height: 100%;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            display: grid;
            justify-items: center;
            align-items: center;
            background-color: #3a3a3a;
        }

        #logout {
            opacity: 0;
        }

        #main-holder {
            width: 50%;
            min-height: 70%;
            height: auto;
            box-sizing: border-box;
            padding: 32px 0;
            display: grid;
            justify-items: center;
            align-items: center;
            background-color: white;
            border-radius: 7px;
            box-shadow: 0px 0px 5px 2px black;
        }

        #login-error-msg-holder {
            width: 100%;
            display: grid;
            justify-items: center;
            align-items: center;
        }

        #login-error-msg {
            width: 70%;
            text-align: center;
            margin: 0;
            padding: 5px;
            font-size: 12px;
            font-weight: bold;
            color: #8a0000;
            border: 1px solid #8a0000;
            background-color: #e58f8f;
            opacity: 0;
        }

        #login-form,
        #register-form {
            align-self: flex-start;
            display: grid;
            justify-items: center;
            align-items: center;
        }

        .login-form-field::placeholder {
            color: #3a3a3a;
        }

        .login-form-field {
            border: none;
            border-bottom: 1px solid #3a3a3a;
            margin-bottom: 10px;
            border-radius: 3px;
            outline: none;
            padding: 0px 0px 5px 5px;
        }

        .show-password-label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 12px;
            font-size: 13px;
            color: #3a3a3a;
            cursor: pointer;
            user-select: none;
        }

        #login-form-submit,
        #register-form-submit {
            width: 100%;
            padding: 7px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            background-color: #3a3a3a;
            cursor: pointer;
            outline: none;
        }

        #register-header {
            margin: 24px 0 8px;
            font-size: 20px;
        }
    </style>

    <script>
        const loginForm = document.getElementById("login-form");
        const loginButton = document.getElementById("login-form-submit");
        const loginErrorMsg = document.getElementById("login-error-msg");
        const logoutLink = document.getElementById("logout");
        const registerForm = document.getElementById("register-form");
        const registerButton = document.getElementById("register-form-submit");
        const mainHolder = document.getElementById("main-holder");
        const loginHeader = document.getElementById("login-header");
        const passwordField = document.getElementById("password-field");
        const registerPasswordField = document.getElementById("register-password-field");
        const showLoginPassword = document.getElementById("show-login-password");
        const showRegisterPassword = document.getElementById("show-register-password");

        showLoginPassword.addEventListener("change", () => {
            passwordField.type = showLoginPassword.checked ? "text" : "password";
        });

        showRegisterPassword.addEventListener("change", () => {
            registerPasswordField.type = showRegisterPassword.checked ? "text" : "password";
        });

        function showError(message) {
            loginErrorMsg.style.color = '#8a0000';
            loginErrorMsg.style.borderColor = '#8a0000';
            loginErrorMsg.style.backgroundColor = '#e58f8f';
            loginErrorMsg.textContent = message || 'Невірний email або пароль';
            loginErrorMsg.style.opacity = 1;
        }

        function showProfile(data) {
            loginForm.remove();
            registerForm.remove();
            document.getElementById("register-header").remove();
            loginErrorMsg.remove();
            loginHeader.remove();

            const hello = document.createElement('p');
            hello.textContent = `Hello ${data.username}`;
            mainHolder.append(hello);
            logoutLink.style.opacity = 1;
        }

        logoutLink.addEventListener("click", async (e) => {
            e.preventDefault();
            const raw = sessionStorage.getItem('session');
            sessionStorage.removeItem('session');
            try {
                const token = JSON.parse(raw).token;
                await axios.get('/logout', { headers: { Authorization: token } });
            } catch (error) {}
            window.location = '/';
        });

        const session = sessionStorage.getItem('session');
        let token;
        try {
            token = JSON.parse(session).token;
        } catch (e) {}

        if (token) {
            axios.get('/', {
                headers: { Authorization: token }
            }).then((response) => {
                if (response.data.username) {
                    showProfile(response.data);
                }
            }).catch(() => {
                sessionStorage.removeItem('session');
            });
        }

        loginButton.addEventListener("click", (e) => {
            e.preventDefault();
            axios({
                method: 'post',
                url: '/api/login',
                data: {
                    login: loginForm.login.value,
                    password: loginForm.password.value
                }
            }).then((response) => {
                sessionStorage.setItem('session', JSON.stringify(response.data));
                location.reload();
            }).catch((error) => {
                const message = error.response && error.response.data && error.response.data.error;
                showError(message);
            });
        });

        registerButton.addEventListener("click", (e) => {
            e.preventDefault();
            axios({
                method: 'post',
                url: '/api/register',
                data: {
                    email: registerForm.email.value,
                    password: registerForm.password.value
                }
            }).then(() => {
                loginErrorMsg.style.color = '#0a5c0a';
                loginErrorMsg.style.borderColor = '#0a5c0a';
                loginErrorMsg.style.backgroundColor = '#b7e4b7';
                loginErrorMsg.textContent = 'Користувача створено. Тепер увійдіть.';
                loginErrorMsg.style.opacity = 1;
            }).catch((error) => {
                const message = error.response && error.response.data && error.response.data.error;
                showError(message);
            });
        });
    </script>
</html>
